services:
  web:
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: >-
      sh -c "npm install --no-audit --no-fund &&
      npm run serve -- --host 0.0.0.0 --port 8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    init: true

volumes:
  node_modules:
